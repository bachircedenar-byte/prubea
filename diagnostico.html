<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico PWA - CEDENAR OT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }
        .header h1 { font-size: 1.4em; }
        .content { padding: 24px; }
        .check {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            border: 1px solid #e0e0e0;
        }
        .check.ok { background: #d4edda; border-color: #c3e6cb; }
        .check.fail { background: #f8d7da; border-color: #f5c6cb; }
        .check.warn { background: #fff3cd; border-color: #ffeaa7; }
        .check-icon { font-size: 1.5em; flex-shrink: 0; }
        .check-text { flex: 1; }
        .check-title { font-weight: 600; margin-bottom: 4px; }
        .check-detail { font-size: 0.85em; color: #666; }
        .summary {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-weight: 600;
        }
        .summary.all-ok { background: #d4edda; color: #155724; }
        .summary.has-fail { background: #f8d7da; color: #721c24; }
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.8em;
            overflow-x: auto;
            margin-top: 8px;
        }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 20px;
            background: #1e3c72;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Diagnóstico PWA</h1>
            <p style="opacity:0.9;font-size:0.9em;">CEDENAR OT - ¿Por qué no aparece el botón de instalar?</p>
        </div>
        <div class="content">
            <div id="results">⏳ Ejecutando diagnóstico...</div>
            <a href="./" class="back-link">← Volver a la app</a>
        </div>
    </div>

    <script>
    async function runDiagnostics() {
        const results = document.getElementById('results');
        let html = '';
        let hasFailure = false;

        // 1. HTTPS
        const isHttps = window.location.protocol === 'https:' || window.location.hostname === 'localhost';
        html += `<div class="check ${isHttps ? 'ok' : 'fail'}">
            <div class="check-icon">${isHttps ? '✅' : '❌'}</div>
            <div class="check-text">
                <div class="check-title">HTTPS / Contexto seguro</div>
                <div class="check-detail">URL: ${window.location.href}<br>${isHttps ? 'Estás en HTTPS (o localhost) — OK' : 'NO estás en HTTPS — esto bloquea la instalación PWA'}</div>
            </div>
        </div>`;
        if (!isHttps) hasFailure = true;

        // 2. Manifest accesible (intenta varias rutas)
        let manifestOk = false, manifestData = null, manifestUrl = '';
        const posiblesManifiestos = [
            '/prubea/manifest.json',
            'manifest.json',
            './manifest.json'
        ];
        for (const url of posiblesManifiestos) {
            try {
                const resp = await fetch(url);
                if (resp.ok) {
                    manifestOk = true;
                    manifestData = await resp.json();
                    manifestUrl = url;
                    break;
                }
            } catch (e) { /* intentar siguiente */ }
        }
        html += `<div class="check ${manifestOk ? 'ok' : 'fail'}">
            <div class="check-icon">${manifestOk ? '✅' : '❌'}</div>
            <div class="check-text">
                <div class="check-title">manifest.json accesible</div>
                <div class="check-detail">${manifestOk ? 'Manifest cargado desde: ' + manifestUrl : 'No se pudo cargar el manifest desde ninguna ruta. Verifica que el archivo existe en /prubea/manifest.json'}</div>
                ${manifestData ? `<pre>${JSON.stringify(manifestData, null, 2).substring(0, 800)}</pre>` : ''}
            </div>
        </div>`;
        if (!manifestOk) hasFailure = true;

        // 3. Service Worker registrado
        let swOk = false, swInfo = '';
        if ('serviceWorker' in navigator) {
            try {
                const reg = await navigator.serviceWorker.getRegistration();
                swOk = !!reg;
                if (reg) {
                    swInfo = `Scope: ${reg.scope}<br>Estado: ${reg.active ? 'activo' : (reg.installing ? 'instalando' : (reg.waiting ? 'esperando' : 'desconocido'))}`;
                } else {
                    swInfo = 'No hay service worker registrado';
                }
            } catch (e) { swInfo = 'Error: ' + e.message; }
        } else {
            swInfo = 'Tu navegador no soporta service workers';
        }
        html += `<div class="check ${swOk ? 'ok' : 'fail'}">
            <div class="check-icon">${swOk ? '✅' : '❌'}</div>
            <div class="check-text">
                <div class="check-title">Service Worker</div>
                <div class="check-detail">${swInfo}</div>
            </div>
        </div>`;
        if (!swOk) hasFailure = true;

        // 4. Iconos (verifica que existan en el manifest Y que los archivos carguen)
        let iconsOk = false;
        let iconChecks = [];
        if (manifestData && manifestData.icons) {
            for (const icon of manifestData.icons) {
                try {
                    const resp = await fetch(icon.src, { method: 'HEAD' });
                    iconChecks.push({ src: icon.src, ok: resp.ok });
                } catch (e) {
                    iconChecks.push({ src: icon.src, ok: false });
                }
            }
            iconsOk = iconChecks.length >= 2 && iconChecks.some(c => c.ok);
        }
        html += `<div class="check ${iconsOk ? 'ok' : 'fail'}">
            <div class="check-icon">${iconsOk ? '✅' : '❌'}</div>
            <div class="check-text">
                <div class="check-title">Iconos del manifest</div>
                <div class="check-detail">${iconChecks.length > 0 ? iconChecks.map(c => (c.ok ? '✅' : '❌') + ' ' + c.src).join('<br>') : 'No hay iconos definidos en el manifest'}</div>
            </div>
        </div>`;
        if (!iconsOk) hasFailure = true;

        // 5. Detección de beforeinstallprompt
        let promptSupported = false;
        let installState = 'desconocido';
        if ('BeforeInstallPromptEvent' in window) {
            promptSupported = true;
        }
        html += `<div class="check ${promptSupported ? 'ok' : 'warn'}">
            <div class="check-icon">${promptSupported ? '✅' : '⚠️'}</div>
            <div class="check-text">
                <div class="check-title">Soporte de beforeinstallprompt</div>
                <div class="check-detail">${promptSupported ? 'Tu navegador soporta el evento (Chrome/Edge)' : 'Tu navegador NO soporta beforeinstallprompt (probablemente iOS Safari o Firefox)'}</div>
            </div>
        </div>`;
        if (!promptSupported) {
            // No es error crítico pero no habrá botón automático
        }

        // 6. display mode
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        html += `<div class="check ${isStandalone ? 'warn' : 'ok'}">
            <div class="check-icon">${isStandalone ? '⚠️' : '✅'}</div>
            <div class="check-text">
                <div class="check-title">Modo de visualización</div>
                <div class="check-detail">${isStandalone ? 'La app ya está instalada (estás en modo standalone)' : 'La app NO está instalada aún (estás en navegador normal)'}</div>
            </div>
        </div>`;

        // 7. Resumen
        html += `<div class="summary ${hasFailure ? 'has-fail' : 'all-ok'}">
            ${hasFailure ? '❌ Hay problemas que bloquean la instalación PWA' : '✅ Todos los requisitos se cumplen'}
        </div>`;

        results.innerHTML = html;
    }

    runDiagnostics();
    </script>
</body>
</html>
